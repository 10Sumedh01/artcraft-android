[package]
name = "vectorcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
vectorcraft-engine = { path = "../../crates/engine" }
vectorcraft-ui-egui = { path = "../../crates/ui-egui" }
eframe = { workspace = true, features = ["wgpu", "persistence", "android-game-activity"] }
egui = { workspace = true }
egui-winit = "0.36"
log = { workspace = true }
serde_json = { workspace = true }
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["game-activity"] }

[package.metadata.android]
package = "com.artcraft.vectorcraft"
apk_name = "vectorcraft"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "VectorCraft"
# GameActivity extends AppCompatActivity, which refuses to inflate under a framework-only
# theme; the builder generates res/values/themes.xml with this style (AppCompat parent).
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".VectorCraftActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "VectorCraft"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
# The MAIN/LAUNCHER filter that gives the APK a launcher icon; lib/file_associations.py may
# append VIEW/SEND filters for the app's document types by rewriting this single line.
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "vectorcraft_android"
